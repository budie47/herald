{% load herald_tags humanize %}
<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-2">
  <div class="small text-muted">
    {% if page|length %}Showing {{ page|length }}{% if match_count is not None %} of {{ match_count|intcomma }}{% else %} matching{% endif %}{% else %}Nothing to show{% endif %}
  </div>
  <div class="d-flex align-items-center gap-2">
    <form method="get" class="d-flex align-items-center gap-1">
      {% for k, v in carry_params %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endfor %}
      <label class="small text-muted" for="per_page">Per page</label>
      <select id="per_page" name="per_page" class="form-select form-select-sm w-auto" onchange="this.form.submit()">
        {% for size in page_sizes %}<option value="{{ size }}" {% if size == per_page %}selected{% endif %}>{{ size }}</option>{% endfor %}
      </select>
    </form>
    <ul class="pagination pagination-sm mb-0">
      <li class="page-item {% if not page.has_previous %}disabled{% endif %}"><a class="page-link" href="{% qs after=None before=None %}">First</a></li>
      <li class="page-item {% if not page.has_previous %}disabled{% endif %}"><a class="page-link" href="{% if page.previous_cursor %}{% qs before=page.previous_cursor after=None %}{% else %}#{% endif %}">&laquo; Previous</a></li>
      <li class="page-item {% if not page.has_next %}disabled{% endif %}"><a class="page-link" href="{% if page.next_cursor %}{% qs after=page.next_cursor before=None %}{% else %}#{% endif %}">Next &raquo;</a></li>
    </ul>
  </div>
</div>
