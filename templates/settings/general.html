{% extends "settings/_base.html" %}
{% block title %}General settings{% endblock %}
{% block settings %}
<div class="card"><div class="card-body">
  <h2 class="h5">General</h2>
  <p class="text-muted small">SLO days are only used when the scan data has no <code>SLO Date</code>; they count from the first time the alert was seen.</p>
  <form method="post" style="max-width: 480px">{% csrf_token %}
    {% include "_form_fields.html" %}
    <button class="btn btn-primary">Save</button>
  </form>
</div></div>
{% endblock %}
