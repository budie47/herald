<div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#212529">
  <p>Hello {{ user.display_name }},</p>
  <p>Someone asked to reset the password for your Herald account (<strong>{{ user.email }}</strong>).</p>
  <p><a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}" style="background:#0d6efd;color:#fff;padding:10px 16px;border-radius:6px;text-decoration:none;display:inline-block">Choose a new password</a></p>
  <p style="color:#6c757d">The link is valid for 24 hours. If you didn't ask for this, you can ignore this email.</p>
</div>
